name: UI check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Validate knowledge base
        run: npm run validate:knowledge

      - name: Unit smoke tests
        run: npm test

      - name: Verified engine audit smoke
        run: npm run verify:engine -- --from=2026-10-01 --days=31 > engine-audit.txt

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright UI checks
        run: npx playwright test

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-ui-artifacts
          path: |
            artifacts/
            engine-audit.txt
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
